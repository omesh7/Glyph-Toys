name: Build & Release Glyph Toys

on:
  push:
    branches: [main]
    paths:
      - "*-app/**"
  workflow_dispatch:
    inputs:
      apps:
        description: "App dirs to build (e.g. dvd-bounce-app,meditation-app) or 'all'"
        required: false
        default: "all"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_apps: ${{ steps.set.outputs.has_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.apps }}"
            if [ "$INPUT" = "all" ] || [ -z "$INPUT" ]; then
              APPS=$(ls -d *-app/ 2>/dev/null | sed 's|/||g' | jq -R . | jq -sc .)
            else
              APPS=$(echo "$INPUT" | tr ',' '\n' | jq -R . | jq -sc .)
            fi
          else
            APPS=$(git diff --name-only HEAD~1 HEAD | grep -oP '^[^/]+-app' | sort -u | jq -R . | jq -sc .)
          fi

          if [ "$APPS" = "[]" ] || [ -z "$APPS" ]; then
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_apps=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$APPS" >> "$GITHUB_OUTPUT"
          fi
          echo "Apps to build: $APPS"

  build:
    needs: detect
    if: needs.detect.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build ${{ matrix.app }}
        run: |
          cd ${{ matrix.app }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          APP="${{ matrix.app }}"
          NAME="${APP%-app}"
          cp "$APP/app/build/outputs/apk/debug/app-debug.apk" "${NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: "*.apk"
          retention-days: 30

  release:
    needs: [detect, build]
    if: needs.detect.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date +%Y%m%d-%H%M%S)"
          BUILT='${{ needs.detect.outputs.matrix }}'
          APPS=$(echo "$BUILT" | jq -r '.[]' | sed 's/-app$//' | paste -sd ', ')

          gh release create "$TAG" \
            --title "Glyph Toys — ${APPS}" \
            --notes "## Glyph Toys Build

          **Apps:** ${APPS}
          **Commit:** [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})

          ### Install
          1. Download the APK below
          2. Install on Nothing Phone (4a) Pro
          3. Settings > Glyph Interface > Glyph Toys" \
            apks/*.apk
