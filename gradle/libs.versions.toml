[versions]
agp = "9.4.0"
# Must match the KGP that AGP bundles (see its POM), since AGP 9 applies Kotlin itself.
kotlin = "2.2.10"

[libraries]
# Android unit tests run on JUnit 4, so kotlin-test needs its JUnit 4 variant explicitly —
# the plain kotlin-test artifact resolves no test framework here and `Test` won't resolve.
junit = { module = "junit:junit", version = "4.13.2" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

[plugins]
# No kotlin.android plugin: AGP 9 applies Kotlin itself and rejects it being applied twice.
android-application = { id = "com.android.application", version.ref = "agp" }
